plain_zh: 逐段载荷决定能耗和返航电量，窗口限制起飞时刻，实际充电排队影响电池再次出勤；复算闭环确保输出可执行。
notes_zh: 式（9）就绪下界和式（13）评价向量根据原稿流程纠错，其余保留原有关系；完整独立代算使用recalculate-example.py，不将受限公式校验器的跳过作为代算通过。
numeric_example:
  given:
    起飞载荷kg: 14
    电池能量kWh: 4.5
  compute_zh: 独立按原稿各航段和充电模型代算，输出example-results.json；累计比较及窗口约束另行检查。
  result:
    P1能耗kWh: 1.6561133446337557
    P3起飞s: 1534.5491819084286
    P3交付s: 1745.73364543952
