<text x="250.0" y="792.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">检查整批资源与交付约束</text>
<text x="250.0" y="816.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">返回排程或冲突</text>
