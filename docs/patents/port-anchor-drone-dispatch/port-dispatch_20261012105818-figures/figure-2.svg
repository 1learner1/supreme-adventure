<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="915" viewBox="0 0 500 915" role="img" aria-label="图2 初始构造与候选调整共用的排程过程">
<defs>
