<path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="250.0" y="28" text-anchor="middle" font-family="SimSun, Songti SC, serif" font-size="20">图1 任务调整与周转同步重排流程</text>
<line x1="250.0" y1="187" x2="250.0" y2="277" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="250.0" y1="349" x2="250.0" y2="439" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="250.0" y1="511" x2="250.0" y2="601" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="115" width="360" height="72" rx="0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="250.0" y="151.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">S1 获取任务窗口和资源初始状态</text>
<rect x="70" y="277" width="360" height="72" rx="0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="250.0" y="313.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">S2 构造初始架次并调用共用重排</text>
<rect x="70" y="439" width="360" height="72" rx="0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="250.0" y="475.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">S3 每次任务调整均完整重排并判定</text>
<rect x="70" y="601" width="360" height="82" rx="0" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="250.0" y="630.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">S4</text>
<text x="250.0" y="654.0" text-anchor="middle" dominant-baseline="middle" font-family="SimSun, Songti SC, serif" font-size="18">独立复算后输出配送换电及充电预约</text>
</svg>